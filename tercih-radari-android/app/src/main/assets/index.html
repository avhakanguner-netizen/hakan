<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tercih Radarı</title><style>body{font-family:Arial;margin:0;background:#f5f7fb;color:#172033}header{background:#24305e;color:white;padding:24px}main{padding:18px}.card{background:white;border:1px solid #e3e7ef;border-radius:14px;padding:16px;margin-bottom:14px}button,input,select{width:100%;padding:12px;margin-top:8px;border:1px solid #ccd2de;border-radius:10px;box-sizing:border-box}button{background:#4b55c5;color:white;font-weight:bold}.muted{color:#667085;font-size:13px}.result{margin-top:12px;padding:12px;background:#f2f4ff;border-left:4px solid #4b55c5;border-radius:8px}</style><header><h1>Tercih Radarı</h1><div>2025 esaslı çevrimdışı hesaplama sürümü</div></header><main><div class="card"><h2>YKS tercih hesabı</h2><label>Başarı sırası</label><input id="rank" type="number" value="52000"><label>Puan türü</label><select id="type"><option>SAY</option><option>EA</option></select><button id="calc">Hesapla</button><div id="out" class="result">Sıralamanızı girip hesaplayın.</div></div><div class="card"><h2>Uçuk senaryo</h2><label>Kontenjan değişimi (%)</label><input id="quota" type="number" value="-20"><label>Talep değişimi (%)</label><input id="demand" type="number" value="25"><button id="wild">Senaryoyu çalıştır</button><div id="wildout" class="result">Bu bölüm spekülatif model üretir.</div></div><div class="card muted">Bu uygulama karar destek aracıdır. 2026 verisi içermez. Gerçek resmî veri tabanı henüz eklenmemiştir; sonuçlar örnek hesaplama mantığıdır.</div></main><script>document.getElementById('calc').addEventListener('click',()=>{const r=+rank.value;const t=type.value;let msg=r<30000?'İddialı üst programlar araştırılabilir.':r<60000?'Muhtemel ve güvenli tercihler birlikte yazılabilir.':'Güvenli tercih havuzu geniş tutulmalı.';out.innerHTML='<b>'+t+' · '+r.toLocaleString('tr-TR')+'</b><br>'+msg});document.getElementById('wild').addEventListener('click',()=>{const r=+rank.value,q=+quota.value,d=+demand.value;const pressure=(-q*.55+d*.65)/100;const e=Math.max(1,Math.round(r*(1-pressure)));wildout.innerHTML='<b>Spekülatif eşik: '+e.toLocaleString('tr-TR')+'</b><br>Kontenjan '+q+'%, talep '+d+'% varsayımıyla.'});</script></html>
