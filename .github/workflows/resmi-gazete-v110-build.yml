name: Temporary Resmi Gazete v1.1.0 APK Build

on:
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened]
    paths:
      - 'resmi-gazete-v110.patch.py'
      - 'resmi-gazete-v110.trigger'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out build branch
        uses: actions/checkout@v4

      - name: Apply v1.1.0 fixes
        run: python3 resmi-gazete-v110.patch.py

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build installable APK
        working-directory: resmi-gazete-app
        run: gradle --no-daemon --stacktrace clean assembleDebug

      - name: Verify and package
        shell: bash
        run: |
          cp resmi-gazete-app/app/build/outputs/apk/debug/app-debug.apk ResmiGazeteOzeti-v1.1.0.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs ResmiGazeteOzeti-v1.1.0.apk > ResmiGazeteOzeti-v1.1.0-IMZA.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging ResmiGazeteOzeti-v1.1.0.apk > ResmiGazeteOzeti-v1.1.0-APK-BILGI.txt
          grep -q "package: name='com.hakim.resmigazeteozeti' versionCode='2' versionName='1.1.0'" ResmiGazeteOzeti-v1.1.0-APK-BILGI.txt
          sha256sum ResmiGazeteOzeti-v1.1.0.apk > ResmiGazeteOzeti-v1.1.0-SHA256.txt
          (cd resmi-gazete-app && zip -qr ../ResmiGazeteOzeti-v1.1.0-AndroidStudio.zip . -x '*/build/*' '.gradle/*')
          cp resmi-gazete-app/README_TR.md ResmiGazeteOzeti-v1.1.0-KURULUM.md
          zip -q ResmiGazeteOzeti-v1.1.0-TAM-PAKET.zip \
            ResmiGazeteOzeti-v1.1.0.apk \
            ResmiGazeteOzeti-v1.1.0-AndroidStudio.zip \
            ResmiGazeteOzeti-v1.1.0-KURULUM.md \
            ResmiGazeteOzeti-v1.1.0-APK-BILGI.txt \
            ResmiGazeteOzeti-v1.1.0-IMZA.txt \
            ResmiGazeteOzeti-v1.1.0-SHA256.txt

      - name: Upload ready package
        uses: actions/upload-artifact@v4
        with:
          name: ResmiGazeteOzeti-v1.1.0-HAZIR-PAKET
          path: |
            ResmiGazeteOzeti-v1.1.0.apk
            ResmiGazeteOzeti-v1.1.0-TAM-PAKET.zip
            ResmiGazeteOzeti-v1.1.0-AndroidStudio.zip
            ResmiGazeteOzeti-v1.1.0-KURULUM.md
            ResmiGazeteOzeti-v1.1.0-APK-BILGI.txt
            ResmiGazeteOzeti-v1.1.0-IMZA.txt
            ResmiGazeteOzeti-v1.1.0-SHA256.txt
          if-no-files-found: error
          retention-days: 7
