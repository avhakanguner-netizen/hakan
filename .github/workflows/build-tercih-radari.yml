name: Build Tercih Radari APK

on:
  push:
    paths:
      - 'tercih-radari-android/**'
      - '.github/workflows/build-tercih-radari.yml'
  pull_request:
    paths:
      - 'tercih-radari-android/**'
      - '.github/workflows/build-tercih-radari.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tercih-radari-android/tools/requirements.txt
      - name: Install data dependencies
        run: pip install -r tercih-radari-android/tools/requirements.txt
      - name: Build official YÖK Atlas 2022-2025 dataset
        run: python tercih-radari-android/tools/build_yokatlas_dataset.py
      - name: Validate ranking and quota dataset
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('tercih-radari-android/app/src/main/assets/programs.json')
          data=json.loads(p.read_text(encoding='utf-8'))
          assert data['schemaVersion'] >= 3
          assert data['years']==[2022,2023,2024,2025]
          assert 2026 not in data['years']
          assert data['programCount'] >= 5000
          assert data['rankedProgramCount'] >= 3000
          sample=next(x for x in data['programs'] if x.get('latestRank') is not None)
          assert 'latestQuota' in sample and 'latestPlaced' in sample
          print('programCount=',data['programCount'],'ranked=',data['rankedProgramCount'])
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: tercih-radari-android
        run: gradle assembleDebug --stacktrace
      - name: Verify APK structure
        run: |
          APK=tercih-radari-android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK"
          ls -lh "$APK"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Tercih-Radari-Siralama-Kontenjan-APK
          path: tercih-radari-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload generated public data
        uses: actions/upload-artifact@v4
        with:
          name: Tercih-Radari-Siralama-Data
          path: tercih-radari-android/public/data/programs.json
          if-no-files-found: error
          retention-days: 30
