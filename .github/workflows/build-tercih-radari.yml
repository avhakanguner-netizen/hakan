name: Build Tercih Radari APK

on:
  push:
    paths:
      - 'tercih-radari-android/**'
      - '.github/workflows/build-tercih-radari.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: tercih-radari-android
        run: gradle assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Tercih-Radari-APK
          path: tercih-radari-android/app/build/outputs/apk/debug/app-debug.apk
