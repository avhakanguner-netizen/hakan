name: Build MHI SRK503 IR APK

on:
  push:
    paths:
      - 'mhi-srk503-ir-android/**'
      - '.github/workflows/build-mhi-srk503-ir.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: mhi-srk503-ir-android
        run: gradle assembleDebug --stacktrace
      - name: Verify APK
        run: |
          APK=mhi-srk503-ir-android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK"
          ls -lh "$APK"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MHI-SRK503-IR-APK
          path: mhi-srk503-ir-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
