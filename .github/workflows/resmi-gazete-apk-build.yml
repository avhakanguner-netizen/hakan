name: Temporary Resmi Gazete APK Build

on:
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened]
    paths:
      - 'resmi-gazete-apk-build.trigger'
      - 'resmi-gazete-app/**'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out build branch
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build installable APK
        working-directory: resmi-gazete-app
        run: gradle --no-daemon --stacktrace clean assembleDebug

      - name: Verify and package
        shell: bash
        run: |
          cp resmi-gazete-app/app/build/outputs/apk/debug/app-debug.apk ResmiGazeteOzeti-v1.0.0.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose ResmiGazeteOzeti-v1.0.0.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging ResmiGazeteOzeti-v1.0.0.apk > ResmiGazeteOzeti-v1.0.0-APK-BILGI.txt
          sha256sum ResmiGazeteOzeti-v1.0.0.apk > ResmiGazeteOzeti-v1.0.0-SHA256.txt
          (cd resmi-gazete-app && zip -qr ../ResmiGazeteOzeti-v1.0.0-AndroidStudio.zip . -x '*/build/*' '.gradle/*')

      - name: Upload ready package
        uses: actions/upload-artifact@v4
        with:
          name: ResmiGazeteOzeti-HAZIR-PAKET
          path: |
            ResmiGazeteOzeti-v1.0.0.apk
            ResmiGazeteOzeti-v1.0.0-SHA256.txt
            ResmiGazeteOzeti-v1.0.0-APK-BILGI.txt
            ResmiGazeteOzeti-v1.0.0-AndroidStudio.zip
          if-no-files-found: error
          retention-days: 7
