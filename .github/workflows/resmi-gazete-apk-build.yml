name: Temporary Resmi Gazete APK Build

on:
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened]
    paths:
      - 'resmi-gazete-apk-build.trigger'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out build branch
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore project
        shell: bash
        run: |
          cat .tmp-rg-build/source.b64.* > project.b64
          base64 --decode project.b64 > project.zip
          unzip -q project.zip

      - name: Build installable APK
        working-directory: ResmiGazeteOzeti
        run: gradle --no-daemon --stacktrace clean assembleDebug

      - name: Prepare package
        shell: bash
        run: |
          cp ResmiGazeteOzeti/app/build/outputs/apk/debug/app-debug.apk ResmiGazeteOzeti-v1.0.0.apk
          sha256sum ResmiGazeteOzeti-v1.0.0.apk > ResmiGazeteOzeti-v1.0.0-SHA256.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ResmiGazeteOzeti-APK
          path: |
            ResmiGazeteOzeti-v1.0.0.apk
            ResmiGazeteOzeti-v1.0.0-SHA256.txt
          if-no-files-found: error
          retention-days: 7
