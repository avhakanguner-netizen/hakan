name: Temporary Altimetre Pro APK Build

on:
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened]
    paths:
      - 'altimetre-pro-apk-build.trigger'
      - '.tmp-altimetre-build/**'
      - '.github/workflows/altimetre-pro-apk-build.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out build branch
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager 'platforms;android-36' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Restore and prepare Android Studio project
        shell: bash
        run: |
          cat .tmp-altimetre-build/source.b64.* > altimetre-project.b64
          base64 --decode altimetre-project.b64 > altimetre-project.zip
          echo 'b985db250f0a919a443c26caf7bc2c8f4c36d6ecd734b64c701ebfa73eb5d180  altimetre-project.zip' | sha256sum -c -
          unzip -q altimetre-project.zip
          sed -i 's/androidx.compose:compose-bom:2026.04.00/androidx.compose:compose-bom:2026.06.00/' AltimetrePro/app/build.gradle.kts
          sed -i 's/fun setUnitSystem(/fun updateUnitSystem(/g; s/setUnitSystem(/updateUnitSystem(/g' AltimetrePro/app/src/main/java/com/hakan/altimetrepro/AltimeterController.kt AltimetrePro/app/src/main/java/com/hakan/altimetrepro/ui/AltimeterApp.kt
          sed -i 's/fun setThemeMode(/fun updateThemeMode(/g; s/setThemeMode(/updateThemeMode(/g' AltimetrePro/app/src/main/java/com/hakan/altimetrepro/AltimeterController.kt AltimetrePro/app/src/main/java/com/hakan/altimetrepro/ui/AltimeterApp.kt
          sed -i 's/fun setSmoothing(/fun updateSmoothing(/g; s/setSmoothing(/updateSmoothing(/g' AltimetrePro/app/src/main/java/com/hakan/altimetrepro/AltimeterController.kt AltimetrePro/app/src/main/java/com/hakan/altimetrepro/ui/AltimeterApp.kt
          sed -i 's/fun setKeepScreenOn(/fun updateKeepScreenOn(/g; s/setKeepScreenOn(/updateKeepScreenOn(/g' AltimetrePro/app/src/main/java/com/hakan/altimetrepro/AltimeterController.kt AltimetrePro/app/src/main/java/com/hakan/altimetrepro/ui/AltimeterApp.kt

      - name: Run tests and build installable APK
        working-directory: AltimetrePro
        run: gradle --no-daemon --stacktrace clean test assembleDebug

      - name: Verify and package
        shell: bash
        run: |
          cp AltimetrePro/app/build/outputs/apk/debug/app-debug.apk AltimetrePro-v1.0.0.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs AltimetrePro-v1.0.0.apk > AltimetrePro-v1.0.0-IMZA-BILGI.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging AltimetrePro-v1.0.0.apk > AltimetrePro-v1.0.0-APK-BILGI.txt
          sha256sum AltimetrePro-v1.0.0.apk > AltimetrePro-v1.0.0-SHA256.txt
          (cd AltimetrePro && zip -qr ../AltimetrePro-v1.0.0-AndroidStudio.zip . -x '*/build/*' '.gradle/*')

      - name: Upload ready package
        uses: actions/upload-artifact@v4
        with:
          name: AltimetrePro-HAZIR-PAKET
          path: |
            AltimetrePro-v1.0.0.apk
            AltimetrePro-v1.0.0-SHA256.txt
            AltimetrePro-v1.0.0-APK-BILGI.txt
            AltimetrePro-v1.0.0-IMZA-BILGI.txt
            AltimetrePro-v1.0.0-AndroidStudio.zip
          if-no-files-found: error
          retention-days: 7
