name: Update Tercih Radari Data

on:
  push:
    paths:
      - 'tercih-radari-android/tools/**'
      - '.github/workflows/update-tercih-radari-data.yml'
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tercih-radari-android/tools/requirements.txt
      - run: pip install -r tercih-radari-android/tools/requirements.txt
      - name: Download and normalize official data
        run: python tercih-radari-android/tools/build_dataset_v2.py
      - name: Validate years, record count and university names
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('tercih-radari-android/public/data/programs.json').read_text(encoding='utf-8'))
          assert data['years']==[2022,2023,2024,2025]
          assert 2026 not in data['years']
          assert data['programCount'] >= 500
          bad={'DEVLET','VAKIF','KKTC','YABANCI','ÖZEL'}
          invalid=sum((not x.get('university')) or x.get('university','').upper() in bad for x in data['programs'])
          assert invalid / data['programCount'] <= 0.03
          print('programCount=', data['programCount'], 'invalidUniversity=', invalid)
          PY
      - name: Commit refreshed data
        run: |
          git config user.name 'tercih-radari-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add tercih-radari-android/public/data/programs.json tercih-radari-android/app/src/main/assets/programs.json
          if git diff --cached --quiet; then
            echo 'Veri değişmedi.'
          else
            git commit -m 'Tercih Radarı 2022-2025 resmî verilerini güncelle'
            git push
          fi
