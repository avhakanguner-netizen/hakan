name: Update Tercih Radari Data

on:
  push:
    paths:
      - 'tercih-radari-android/tools/**'
      - '.github/workflows/update-tercih-radari-data.yml'
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tercih-radari-android/tools/requirements.txt
      - run: pip install -r tercih-radari-android/tools/requirements.txt
      - name: Download ranking and quota data from official YÖK Atlas API
        run: python tercih-radari-android/tools/build_yokatlas_dataset.py
      - name: Validate years, rankings and quotas
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('tercih-radari-android/public/data/programs.json').read_text(encoding='utf-8'))
          assert data['schemaVersion'] >= 3
          assert 2025 in data['years']
          assert 2026 not in data['years']
          assert data['programCount'] >= 5000
          assert data['rankedProgramCount'] >= 3000
          assert data['quotaProgramCount'] >= 3000
          sample=next(x for x in data['programs'] if x.get('latestRank') is not None)
          assert 'latestQuota' in sample and 'latestPlaced' in sample
          print('years=',data['years'],'programCount=',data['programCount'],'ranked=',data['rankedProgramCount'],'quota=',data['quotaProgramCount'])
          PY
      - name: Commit refreshed data
        run: |
          git config user.name 'tercih-radari-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add tercih-radari-android/public/data/programs.json tercih-radari-android/app/src/main/assets/programs.json
          if git diff --cached --quiet; then
            echo 'Veri değişmedi.'
          else
            git commit -m 'Tercih Radarı başarı sırası ve kontenjan verilerini güncelle'
            git push
          fi
